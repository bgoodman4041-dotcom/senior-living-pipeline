name: Refresh live data

# Pulls nearby amenities and environmental screening for every site from OpenStreetMap and the state and federal
# GIS services, then commits the snapshots to the branch it ran on, so the site maps never wait on the public
# Overpass servers. Each commit to main redeploys Vercel.
on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-live-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch places
        env:
          PREFETCH_PLACES: "1"
          PREFETCH_STRICT: "1"
          PREFETCH_BUDGET_MIN: "45"
          PREFETCH_WORKERS: "1"
          PREFETCH_MAX_AGE_DAYS: "5"
        run: node --experimental-strip-types --no-warnings scripts/prefetch-places.mjs
      - name: Environmental screening
        run: node scripts/screen-sites.mjs || true
      - name: Commit snapshots
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/places data/screening.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "Refresh nearby places and site screening" && git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH")
