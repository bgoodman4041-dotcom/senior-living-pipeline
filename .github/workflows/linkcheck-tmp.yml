name: Temporary external link check

# One-off check of every external link on the site (this branch only). Removed after the results are read.
on:
  push:
    branches: [claude/project-thread-htjn5w]
    paths: [.github/linkcheck-urls.txt, .github/workflows/linkcheck-tmp.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check links
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          check() {
            u="$1"
            out=$(curl -s -o /dev/null -L --max-time 30 --retry 1 -A "$UA" -H "Accept: text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" -w "%{http_code} %{url_effective}" "$u" 2>/dev/null) || out="000 -"
            echo "RESULT ${out%% *} $u -> ${out#* }"
          }
          export -f check; export UA
          xargs -a .github/linkcheck-urls.txt -P 8 -I{} bash -c 'check "$@"' _ {} | sort
