name: Screen sites

# Environmental and regulatory screening of every site from official GIS (FEMA, USFWS, EPA, NJDEP, NYSDEC).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 1 * *"   # monthly

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/screen-sites.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screening.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "Refresh site screening" && git pull --rebase origin main && git push)
